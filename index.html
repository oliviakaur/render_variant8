<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="modulepreload" href="https://cdn.jsdelivr.net/gh/luqmanthinkpad/csrnew/app.js" crossorigin="anonymous">

  <!-- Static DNS-Prefetch for API & CDN -->
  <link rel="dns-prefetch" href="//bunbunserver.my.id">
  <link rel="dns-prefetch" href="//cdn.jsdelivr.net">

  <!-- Core SEO Metadata (Mutated in place by app.js) -->
  <title id="meta-title">Technical Knowledge Base</title>
  <meta id="meta-desc" name="description" content="Comprehensive technical specifications, wiring diagrams, and diagnostic troubleshooting guides.">
  <meta id="meta-keywords" name="keywords" content="technical specifications, diagnostic guides, troubleshooting, system diagrams">
  <meta id="meta-robots" name="robots" content="index, follow">

  <!-- Open Graph Metadata (Mutated in place by app.js) -->

  <meta id="og-desc" property="og:description" content="Comprehensive technical specifications, wiring diagrams, and diagnostic troubleshooting guides.">

  <!-- Dynamic JSON-LD Structured Data Container -->

  <!-- Variant 8: Deep Indigo & Electric Lime Lab Design Tokens & Responsive Grid Styles (Minified) -->
  <style>:root{--bg-page:#0d0f21;--bg-surface:#161936;--bg-muted:#21254d;--text-primary:#f8fafc;--text-secondary:#cbd5e1;--text-muted:#94a3b8;--accent:#a3e635;--accent-hover:#bef264;--border-color:#2e3466;--font-sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;--container-max-width:1160px;--article-max-width:840px;--grid-columns:repeat(auto-fill,minmax(310px,1fr));--gallery-columns:repeat(auto-fill,minmax(260px,1fr));--card-radius:8px;--section-gap:2rem;--shadow-sm:0 4px 12px rgba(5,6,18,0.45)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);background-color:var(--bg-page);color:var(--text-primary);line-height:1.65;-webkit-font-smoothing:antialiased}a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-hover);text-decoration:underline}img{max-width:100%;height:auto;display:block;background-color:var(--bg-muted)}.container{max-width:var(--container-max-width);margin:0 auto;padding:0 1.25rem}.site-header{background-color:var(--bg-surface);border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:20}.header-inner{display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:1rem;padding:0.85rem 0}.brand-title{font-size:1.18rem;font-weight:700;letter-spacing:0.01em;color:var(--text-primary);text-decoration:none}.brand-title:hover{color:var(--accent-hover);text-decoration:none}.site-nav{display:flex;align-items:center;gap:0.5rem}.nav-link{display:inline-flex;align-items:center;gap:0.35rem;padding:0.35rem 0.8rem;border-radius:999px;border:1px solid var(--border-color);font-size:0.83rem;font-weight:600;background-color:var(--bg-muted);color:var(--text-secondary);text-decoration:none;transition:background-color 0.15s ease,color 0.15s ease,border-color 0.15s ease}.nav-link:hover,.nav-link.is-active{background-color:var(--accent);border-color:var(--accent);color:#090a17;font-weight:700;text-decoration:none}.nav-count{font-family:var(--font-mono);font-size:0.74rem;opacity:0.85}.home-categories{background-color:var(--bg-surface);border:1px solid var(--border-color);border-left:3px solid var(--accent);border-radius:var(--card-radius);padding:1.35rem 1.5rem;margin-top:2.25rem;box-shadow:var(--shadow-sm)}.home-categories[hidden]{display:none !important}.home-categories-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.9rem;padding-bottom:0.65rem;border-bottom:1px solid var(--border-color)}.home-categories-title{margin:0;font-size:0.94rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--accent)}.home-categories-list{display:flex;flex-wrap:wrap;gap:0.5rem;list-style:none;padding:0;margin:0}.ad-slot-top{display:flex;justify-content:center;align-items:center;margin:1.25rem auto 0 auto;min-height:50px;overflow:hidden}@media (min-width:768px){.ad-slot-top{min-height:90px}}.ad-slot-top[hidden],.ad-slot-sticky-bottom[hidden]{display:none !important}.ad-slot-sticky-bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:40;display:flex;justify-content:center;align-items:center;width:300px;height:250px;max-width:100vw;overflow:hidden;background-color:transparent;line-height:0}.ad-iframe{border:0;display:block;margin:0 auto;max-width:100%;background-color:transparent}main#app{padding:var(--section-gap) 0;min-height:70vh;transition:opacity 0.15s ease}main#app[aria-busy="true"]{opacity:0.55;pointer-events:none}.section-header{margin-bottom:1.5rem;padding-left:0.9rem;border-left:3px solid var(--accent)}.section-title{margin:0 0 0.35rem 0;font-size:1.75rem;font-weight:700;line-height:1.25;color:var(--text-primary)}.section-subtitle{margin:0;color:var(--text-secondary);font-size:0.95rem}.article-grid{display:grid;grid-template-columns:var(--grid-columns);gap:1.5rem;list-style:none;padding:0;margin:0}.article-card{background-color:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--card-radius);overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}.card-media{aspect-ratio:3 / 2;overflow:hidden;background-color:var(--bg-muted);border-bottom:1px solid var(--border-color)}.card-media img{width:100%;height:100%;object-fit:cover}.card-body{padding:1.15rem;display:flex;flex-direction:column;flex:1;gap:0.5rem}.card-top-meta{display:flex;align-items:center;justify-content:space-between;gap:0.5rem}.card-category{font-family:var(--font-mono);font-size:0.74rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--accent)}.card-code{font-family:var(--font-mono);font-size:0.72rem;color:var(--text-primary);background-color:var(--bg-muted);padding:0.1rem 0.45rem;border-radius:4px;border:1px solid var(--border-color)}.card-title{margin:0;font-size:1.1rem;line-height:1.35}.card-title a{color:var(--text-primary)}.card-title a:hover{color:var(--accent-hover)}.card-excerpt{margin:0;font-size:0.9rem;color:var(--text-secondary);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.single-article-wrap{max-width:var(--article-max-width);margin:0 auto}.single-article{background-color:var(--bg-surface);border:1px solid var(--border-color);border-top:3px solid var(--accent);border-radius:var(--card-radius);padding:1.75rem;box-shadow:var(--shadow-sm)}.breadcrumb{font-family:var(--font-mono);font-size:0.82rem;color:var(--text-muted);margin-bottom:1rem}.article-title{margin:0 0 0.75rem 0;font-size:clamp(1.5rem,3vw,2.15rem);line-height:1.25;color:var(--text-primary)}.article-meta{display:flex;flex-wrap:wrap;gap:0.75rem;font-family:var(--font-mono);font-size:0.8rem;color:var(--text-muted);margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border-color)}.article-hero{margin:0 0 1.75rem 0;border:1px solid var(--border-color);border-radius:var(--card-radius);overflow:hidden;background-color:var(--bg-muted)}.article-hero img{width:100%;max-height:480px;object-fit:contain;background-color:#070814}.article-hero figcaption,.gallery-card figcaption{font-family:var(--font-mono);padding:0.65rem 0.9rem;font-size:0.8rem;color:var(--text-secondary);background-color:var(--bg-muted);border-top:1px solid var(--border-color)}.article-body p{margin:0 0 1.25rem 0;font-size:1.05rem;color:var(--text-primary)}.article-gallery{margin-top:2.25rem;padding-top:1.75rem;border-top:1px solid var(--border-color)}.gallery-heading{margin:0 0 1rem 0;font-size:1.3rem;color:var(--text-primary)}.gallery-grid{display:grid;grid-template-columns:var(--gallery-columns);gap:1.25rem}.gallery-card{margin:0;border:1px solid var(--border-color);border-radius:var(--card-radius);overflow:hidden;background-color:var(--bg-surface);display:flex;flex-direction:column}.gallery-card img{width:100%;aspect-ratio:3 / 2;object-fit:contain;background-color:#070814}.bottom-links-section{margin-top:1.75rem;background-color:var(--bg-surface);border:1px solid var(--border-color);border-left:3px solid var(--accent);border-radius:var(--card-radius);padding:1.5rem;box-shadow:var(--shadow-sm)}.bottom-links-title{margin:0 0 1rem 0;font-size:1.15rem;color:var(--text-primary)}.link-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:0.85rem}.link-list-item{padding-bottom:0.85rem;border-bottom:1px solid var(--border-color)}.link-list-item:last-child{padding-bottom:0;border-bottom:none}.link-item-title{font-weight:600;font-size:0.98rem;display:inline-block;margin-bottom:0.2rem}.link-item-meta{margin:0;font-size:0.85rem;color:var(--text-secondary)}.site-footer{border-top:1px solid var(--border-color);background-color:var(--bg-surface);padding:1.5rem 0;margin-top:var(--section-gap);font-size:0.85rem;color:var(--text-muted);text-align:center}</style>
</head>
<body data-route="loading">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand-title" href="/" id="brand-link">Technical Knowledge Base</a>
      <nav aria-label="Primary Navigation" class="site-nav" id="main-nav">
        <a class="nav-link is-active" href="/">Home</a>
      </nav>
    </div>
  </header>

  <!-- Global Top Banner Slot (320x50 on Mobile / 728x90 on Non-Mobile, Centered, Zero-CLS Reserved) -->
  <aside aria-label="Advertisement" class="container ad-slot-top" id="ad-top-slot"></aside>

  <main aria-busy="true" class="container" id="app">
    <p>Loading technical articles...</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="footer-year"></span> <span id="footer-site-name">Technical Knowledge Base</span>. All rights reserved.</p>
    </div>
  </footer>

  <!-- Global Sticky Bottom Banner Slot (300x250 on Mobile & Non-Mobile, Humans Only, Immediate Load, No Close Button) -->
  <aside aria-label="Advertisement" class="ad-slot-sticky-bottom" hidden id="ad-bottom-sticky"></aside>

  <!-- External CSR Engine via jsDelivr CDN (Self-Removing Script Tag) -->
  <script id="csr-app-script" src="https://cdn.jsdelivr.net/gh/luqmanthinkpad/csrnew/app.js" type="module"></script>
</body>
</html>
